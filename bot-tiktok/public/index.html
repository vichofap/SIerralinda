<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot danaosth — Panel del live</title>
<style>
  :root {
    --fondo: #12121a;
    --tarjeta: #1d1d2b;
    --borde: #32324a;
    --rosa: #ff2d75;
    --texto: #f2f2f7;
    --texto-suave: #9a9ab0;
    --verde: #2ecc71;
    --rojo: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    padding: 0.9rem 1.2rem;
    background: rgba(18,18,26,0.95);
    border-bottom: 1px solid var(--borde);
    backdrop-filter: blur(8px);
  }
  .titulo { font-size: 1.1rem; font-weight: 700; }
  .titulo span { color: var(--rosa); }
  .estado {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-size: 0.85rem; color: var(--texto-suave);
  }
  .punto {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--rojo);
  }
  .punto.ok { background: var(--verde); }
  .voz {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.9rem; cursor: pointer; user-select: none;
    background: var(--tarjeta); border: 1px solid var(--borde);
    padding: 0.45rem 0.8rem; border-radius: 999px;
  }
  .voz input { accent-color: var(--rosa); width: 18px; height: 18px; cursor: pointer; }
  main {
    max-width: 760px; margin: 0 auto; padding: 1.2rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .aviso {
    text-align: center; color: var(--texto-suave);
    padding: 3rem 1rem; font-size: 0.95rem; line-height: 1.6;
  }
  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 0.9rem 1.1rem;
    animation: aparecer 0.25s ease-out;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .meta {
    display: flex; justify-content: space-between; gap: 0.5rem;
    font-size: 0.8rem; color: var(--texto-suave); margin-bottom: 0.35rem;
  }
  .meta b { color: var(--rosa); font-weight: 600; }
  .pregunta { font-size: 0.95rem; color: var(--texto-suave); margin-bottom: 0.5rem; }
  .respuesta { font-size: 1.15rem; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <div class="titulo">🛍️ danaosth <span>· bot del live</span></div>
  <div class="estado"><span class="punto" id="punto"></span><span id="txtEstado">Conectando…</span></div>
  <label class="voz">
    <input type="checkbox" id="chkVoz">
    🔊 Leer respuestas en voz alta
  </label>
</header>

<main id="lista">
  <div class="aviso" id="avisoInicial">
    Aquí van a aparecer las respuestas del bot cuando la gente pregunte en el live.<br><br>
    💡 Activa <b>"Leer respuestas en voz alta"</b> y deja esta pestaña abierta con volumen:
    si el micrófono capta este audio, los espectadores escucharán las respuestas en la transmisión.
  </div>
</main>

<script>
  const lista = document.getElementById('lista');
  const punto = document.getElementById('punto');
  const txtEstado = document.getElementById('txtEstado');
  const chkVoz = document.getElementById('chkVoz');

  let vozEsp = null;
  function elegirVoz() {
    const voces = speechSynthesis.getVoices();
    vozEsp = voces.find(v => v.lang && v.lang.toLowerCase().startsWith('es')) || null;
  }
  if ('speechSynthesis' in window) {
    elegirVoz();
    speechSynthesis.onvoiceschanged = elegirVoz;
  }

  function leerEnVozAlta(texto) {
    if (!chkVoz.checked || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(texto);
    if (vozEsp) u.voice = vozEsp;
    u.lang = 'es-ES';
    u.rate = 1.0;
    speechSynthesis.speak(u);
  }

  function agregarRespuesta(m) {
    const aviso = document.getElementById('avisoInicial');
    if (aviso) aviso.remove();

    const t = document.createElement('div');
    t.className = 'tarjeta';
    t.innerHTML =
      '<div class="meta"><b></b><span></span></div>' +
      '<div class="pregunta"></div>' +
      '<div class="respuesta"></div>';
    t.querySelector('.meta b').textContent = m.usuario;
    t.querySelector('.meta span').textContent = m.hora;
    t.querySelector('.pregunta').textContent = '❓ ' + m.pregunta;
    t.querySelector('.respuesta').textContent = '💬 ' + m.respuesta;
    lista.prepend(t);

    while (lista.children.length > 50) lista.removeChild(lista.lastChild);
    leerEnVozAlta(m.respuesta);
  }

  function conectarWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host);

    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.tipo === 'respuesta') agregarRespuesta(m);
      if (m.tipo === 'estado') {
        punto.classList.toggle('ok', m.conectado);
        txtEstado.textContent = m.conectado
          ? 'Conectado al live de @' + m.usuario
          : (m.detalle || 'Esperando el live de @' + m.usuario);
      }
    };
    ws.onclose = () => {
      punto.classList.remove('ok');
      txtEstado.textContent = 'Bot apagado — reintentando…';
      setTimeout(conectarWS, 3000);
    };
  }
  conectarWS();
</script>
</body>
</html>
